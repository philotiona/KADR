name: KADR Lab 7

# Lab 8: heavy emulator suite runs on demand (Actions -> KADR Lab 7 -> Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0" > /dev/null
      - run: bash ./gradlew --continue :app:lintDebug :app:createDebugUnitTestCoverageReport -PlabCoverage -ProbolectricLab
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lint-junit-jacoco
          path: app/build/reports/

  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0" > /dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            bash ./gradlew :app:connectedDebugAndroidTest -PorchestrateLab &&
            bash ./gradlew :app:createDebugAndroidTestCoverageReport -PlabCoverage -PisolateLab
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: espresso-android-jacoco
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
