# Lab 8, task 11 — Continuous Delivery.
# Tag vX.Y.Z  ->  build signed AAB + APK (keys from CI Secrets)
#             ->  "internal" track: GitHub pre-release (+ Google Play internal, if configured)
#             ->  manual approval (environment "production" has required reviewers)
#             ->  "production" track: release marked as Latest (+ Play production staged rollout)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Check that the tag matches versionName
        id: version
        run: |
          VN=$(grep -E '^def version(Major|Minor|Patch) = ' app/build.gradle | awk '{print $4}' | paste -sd.)
          TAG="${GITHUB_REF_NAME#v}"
          echo "versionName=$VN tag=$TAG"
          if [ "$VN" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match versionName $VN in app/build.gradle"
            exit 1
          fi
          echo "version=$VN" >> "$GITHUB_OUTPUT"

      - name: Restore upload keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KADR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KADR_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kadr-upload.jks"
          echo "KADR_KEYSTORE_PATH=$RUNNER_TEMP/kadr-upload.jks" >> "$GITHUB_ENV"

      - name: Lint, test, build AAB and APK
        env:
          KADR_KEYSTORE_PASSWORD: ${{ secrets.KADR_KEYSTORE_PASSWORD }}
          KADR_KEY_ALIAS: ${{ secrets.KADR_KEY_ALIAS }}
          KADR_KEY_PASSWORD: ${{ secrets.KADR_KEY_PASSWORD }}
        run: bash ./gradlew :app:checkstyleMain :app:testDebugUnitTest :app:bundleRelease :app:assembleRelease

      - name: Verify signature and collect files
        env:
          VN: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk  "dist/KADR-$VN.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/KADR-$VN.aab"
          cp app/build/outputs/mapping/release/mapping.txt  "dist/KADR-$VN-mapping.txt"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Release notes = this version's section of CHANGELOG.md
          awk -v v="$VN" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/kadr-upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: kadr-release-${{ steps.version.outputs.version }}
          path: dist/

  internal:
    name: Internal track
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kadr-release-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish GitHub pre-release (internal testers)
        uses: softprops/action-gh-release@v2
        with:
          name: KADR ${{ needs.build.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          files: |
            dist/KADR-*.apk
            dist/KADR-*.aab
            dist/KADR-*-mapping.txt
            dist/SHA256SUMS.txt

      - name: Upload to Google Play internal track
        if: ${{ vars.PLAY_ENABLED == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.kaspikids
          releaseFiles: dist/KADR-${{ needs.build.outputs.version }}.aab
          mappingFile: dist/KADR-${{ needs.build.outputs.version }}-mapping.txt
          whatsNewDirectory: distribution/whatsnew
          track: internal
          status: completed

  production:
    name: Production track
    needs: [build, internal]
    runs-on: ubuntu-latest
    environment:
      name: production          # required reviewers => manual "Approve and deploy"
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kadr-release-${{ needs.build.outputs.version }}
          path: dist

      - name: Promote GitHub release to production (Latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest

      - name: Promote on Google Play (staged rollout 10%)
        if: ${{ vars.PLAY_ENABLED == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.kaspikids
          releaseFiles: dist/KADR-${{ needs.build.outputs.version }}.aab
          track: production
          status: inProgress
          userFraction: 0.1
