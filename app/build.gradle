plugins {
    id 'com.android.application'
    id 'checkstyle'
}

def legacySmoke = providers.gradleProperty('legacySmoke').isPresent()
def orchestrateLab = providers.gradleProperty('orchestrateLab').isPresent()
def isolatedTests = orchestrateLab || providers.gradleProperty('isolateLab').isPresent()
def labCoverage = providers.gradleProperty('labCoverage').isPresent()
def robolectricLab = providers.gradleProperty('robolectricLab').isPresent()
// -PnoR8 builds the same release without R8, only to measure the size difference (task 4).
def useR8 = !providers.gradleProperty('noR8').isPresent()
def espressoVersion = '3.7.0'

// ---- Lab 8, task 2: Semantic Versioning (MAJOR.MINOR.PATCH) ----
// versionCode = MAJOR * 10000 + MINOR * 100 + PATCH  ->  1.2.1 = 10201.
// It only grows, so every store upload gets a unique, increasing code.
def versionMajor = 1
def versionMinor = 0
def versionPatch = 0
def kadrVersionName = "${versionMajor}.${versionMinor}.${versionPatch}"
def kadrVersionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch

// ---- Lab 8, task 3/5: secrets live outside Git ----
// Priority: keystore.properties / local.properties (developer PC) -> environment variables (CI).
def localProps = new Properties()
['local.properties', 'keystore.properties'].each { name ->
    def f = rootProject.file(name)
    if (f.exists()) f.withInputStream { localProps.load(it) }
}
def secret = { String key, String env -> localProps.getProperty(key) ?: System.getenv(env) }
def releaseStore = secret('kadr.storeFile', 'KADR_KEYSTORE_PATH')
def stagingApi = localProps.getProperty('kadr.stagingApiUrl') ?: 'https://philotiona.github.io/KADR/staging/api/v1/'

android {
    namespace 'com.example.kaspikids'
    compileSdk 35
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.example.kaspikids"
        minSdk 24
        targetSdk 35
        versionCode kadrVersionCode
        versionName kadrVersionName
        testInstrumentationRunner legacySmoke
                ? 'com.example.kaspikids.CinemaSmokeTest'
                : 'androidx.test.runner.AndroidJUnitRunner'
        if (orchestrateLab) {
            testInstrumentationRunnerArguments clearPackageData: 'true'
        }
    }

    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword secret('kadr.storePassword', 'KADR_KEYSTORE_PASSWORD')
                keyAlias secret('kadr.keyAlias', 'KADR_KEY_ALIAS')
                keyPassword secret('kadr.keyPassword', 'KADR_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix isolatedTests ? '.labtest' : '.debug'
            versionNameSuffix '-debug'
            buildConfigField 'String', 'ENVIRONMENT', '"debug"'
            buildConfigField 'String', 'API_BASE_URL', '"http://127.0.0.1:8080/api/v1/"'
            buildConfigField 'boolean', 'DIAGNOSTICS', 'true'
            enableUnitTestCoverage labCoverage
            enableAndroidTestCoverage labCoverage
        }
        release {
            // Lab 8, task 4: R8 shrinking + obfuscation + optimisation, unused resources removed.
            minifyEnabled useR8
            shrinkResources useR8
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'ENVIRONMENT', '"release"'
            buildConfigField 'String', 'API_BASE_URL', '"https://philotiona.github.io/KADR/api/v1/"'
            buildConfigField 'boolean', 'DIAGNOSTICS', 'false'
            // Signed only when the upload key is available (developer PC or CI secrets).
            signingConfig releaseStore ? signingConfigs.release : null
        }
        staging {
            initWith release
            applicationIdSuffix '.staging'
            versionNameSuffix '-staging'
            buildConfigField 'String', 'ENVIRONMENT', '"staging"'
            buildConfigField 'String', 'API_BASE_URL', "\"${stagingApi}\""
            buildConfigField 'boolean', 'DIAGNOSTICS', 'true'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        benchmark {
            initWith release
            applicationIdSuffix '.benchmark'
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    sourceSets {
        release.java.srcDir 'src/production/java'
        staging.java.srcDir 'src/production/java'
        benchmark.java.srcDir 'src/production/java'
        if (robolectricLab) testDebug.java.srcDir 'src/testRobolectric/java'
    }

    testOptions {
        animationsDisabled = true
        unitTests.includeAndroidResources = robolectricLab
        unitTests.all { test ->
            test.systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
        if (orchestrateLab) execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    debugImplementation "androidx.test.espresso:espresso-idling-resource:$espressoVersion"
    debugImplementation 'androidx.room:room-runtime:2.6.1'
    debugAnnotationProcessor 'androidx.room:room-compiler:2.6.1'
    debugImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    testImplementation 'junit:junit:4.13.2'
    testDebugImplementation 'org.mockito:mockito-core:5.18.0'
    testDebugImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testDebugImplementation 'org.json:json:20240303'
    if (robolectricLab) {
        testDebugImplementation 'androidx.test:core:1.6.1'
        testDebugImplementation 'org.robolectric:robolectric:4.15.1'
    }

    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoVersion"
    androidTestImplementation "androidx.test.espresso:espresso-intents:$espressoVersion"
    androidTestUtil 'androidx.test:orchestrator:1.5.1'
}


// ---- Lab 8, task 10: Java linter for CI (ktlint/detekt are Kotlin-only) ----
checkstyle {
    toolVersion = '10.20.1'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxWarnings = 50
}
tasks.register('checkstyleMain', Checkstyle) {
    group = 'verification'
    description = 'Runs Checkstyle on app Java sources.'
    source 'src/main/java', 'src/production/java', 'src/debug/java'
    include '**/*.java'
    classpath = files()
    reports {
        xml.required = true
        html.required = true
    }
}
